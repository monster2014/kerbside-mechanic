<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Kerbside Mechanic</title><link rel="stylesheet" href="/style.css"><style>.wrap{max-width:1200px;margin:45px auto;padding:0 20px}.hidden{display:none!important}.scroll{overflow:auto}table{width:100%;min-width:850px;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #31413a;text-align:left;vertical-align:top;overflow-wrap:anywhere}.row{display:flex;gap:12px;flex-wrap:wrap}button{cursor:pointer}</style></head><body><header><a href="/">🔧 KERBSIDE <b>MECHANIC</b></a><nav><a href="/">View website</a><button class="btn hidden" id="logout">Log out</button></nav></header><main class="wrap"><section class="panel" id="loginPanel"><h1>🔐 Staff login</h1><form id="loginForm"><label>Username<input name="username" autocomplete="username" value="admin" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn">Sign in</button><p id="loginMsg" role="status"></p></form></section><div id="dashboard" class="hidden"><small>STAFF AREA</small><h1>Mechanic Dashboard</h1><div class="row"><button class="btn" id="tabEnquiries">Bookings & quotes</button><button class="btn" id="tabServices">Services & prices</button><button class="btn" id="refresh">Refresh</button></div><section id="enquiriesPanel" class="panel"><h2>Customer enquiries</h2><p>Requests are not confirmed appointments until you contact the customer.</p><div class="scroll"><table><thead><tr><th>Received</th><th>Customer</th><th>Contact</th><th>Vehicle / service</th><th>Message</th><th>Status</th></tr></thead><tbody id="enquiryRows"></tbody></table></div></section><section id="servicesPanel" class="panel hidden"><h2>Services and pricing</h2><div id="serviceRows"></div><h3>Add service</h3><form id="serviceForm"><label>Name<input name="name" required></label><label>Price / label<input name="price" required placeholder="e.g. From £60"></label><label>Description<input name="description"></label><button class="btn">Add service</button></form></section><p id="dashboardMsg" role="status"></p></div></main><script src="/admin.js"></script></body></html>
